<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 821 383" width="821" height="383" role="img" aria-labelledby="t d">
<title id="t">imposters demo</title>
<desc id="d">$ npx imposters start --config imposters.json &amp;
Created HTTP imposter "users-api" on port 3000
Imposters admin server running on http://127.0.0.1:2525 (bound to 127.0.0.1, runtime: node)
Admin UI: http://127.0.0.1:2525/_ui
$ curl localhost:3000/users/42
{"id":"42","name":"Alice"}
$ # hot-reload: change the stub while it serves, no restart
$ ID=$(curl -s localhost:2525/imposters | jq -r '.imposters[0].id')
$ STUB=$(curl -s localhost:2525/imposters/$ID/stubs | jq -r '.[0].id')
$ curl -sX PUT localhost:2525/imposters/$ID/stubs/$STUB \
    --json '{"responses":[{"body":{"id":"42","name":"Bob"}}]}' | jq -c .responses
[{"status":200,"body":{"id":"42","name":"Bob"}}]
$ curl localhost:3000/users/42
{"id":"42","name":"Bob"}</desc>
